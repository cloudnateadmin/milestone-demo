<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILESTONE — Clinical Decision Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#eef3f1;
  --bg-2:#e4ece9;
  --surface:#ffffff;
  --surface-2:#f6f9f8;
  --border:#d8e2df;
  --border-strong:#c2d0cc;
  --ink:#0d1a17;
  --ink-muted:#54655f;
  --ink-faint:#8a9b95;

  --sidebar-bg:#0a1e1c;
  --sidebar-bg-2:#0e2825;
  --sidebar-fg:#c7dbd5;
  --sidebar-fg-dim:#7fa39a;
  --sidebar-border:#173733;
  --sidebar-active:#123a35;
  --sidebar-accent:#39b39e;
  --sidebar-accent-strong:#5fcdb8;

  --accent:#0f7b6c;
  --accent-strong:#0a5c50;
  --accent-soft:#e2f2ee;
  --accent-ink:#063d34;

  --gold:#b6802a;
  --gold-strong:#8f631d;
  --gold-soft:#faf1de;

  --good:#2f7d4f;
  --good-soft:#e6f4ea;
  --good-ink:#1c4d31;
  --warn:#b4780a;
  --warn-soft:#fbf0dd;
  --warn-ink:#6b4506;
  --crit:#b23a2e;
  --crit-soft:#fbeae7;
  --crit-ink:#6e241c;
  --info:#2361b0;
  --info-soft:#e7f0fb;

  --shadow-sm:0 1px 2px rgba(10,25,22,.06);
  --shadow-md:0 4px 16px rgba(10,25,22,.08);
  --shadow-lg:0 16px 40px rgba(10,25,22,.14);

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;

  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Public Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

  --sidebar-w:252px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614;
    --bg-2:#0b1210;
    --surface:#141f1c;
    --surface-2:#182420;
    --border:#25342f;
    --border-strong:#33453e;
    --ink:#e7f0ec;
    --ink-muted:#9db3ac;
    --ink-faint:#6c827a;

    --sidebar-bg:#070f0e;
    --sidebar-bg-2:#0a1615;
    --sidebar-fg:#b9d2ca;
    --sidebar-fg-dim:#5f8078;
    --sidebar-border:#16221f;
    --sidebar-active:#122b27;

    --accent:#39b39e;
    --accent-strong:#5fcdb8;
    --accent-soft:#132a26;
    --accent-ink:#a7ece0;

    --gold:#d9a44f;
    --gold-strong:#e8bd77;
    --gold-soft:#2a2213;

    --good:#4ea975;
    --good-soft:#132a1d;
    --good-ink:#a9e2bf;
    --warn:#d9a13f;
    --warn-soft:#2b2313;
    --warn-ink:#f0c579;
    --crit:#e0685a;
    --crit-soft:#2c1714;
    --crit-ink:#f4a99d;
    --info:#5b9ee6;
    --info-soft:#122234;

    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614;
  --bg-2:#0b1210;
  --surface:#141f1c;
  --surface-2:#182420;
  --border:#25342f;
  --border-strong:#33453e;
  --ink:#e7f0ec;
  --ink-muted:#9db3ac;
  --ink-faint:#6c827a;

  --sidebar-bg:#070f0e;
  --sidebar-bg-2:#0a1615;
  --sidebar-fg:#b9d2ca;
  --sidebar-fg-dim:#5f8078;
  --sidebar-border:#16221f;
  --sidebar-active:#122b27;

  --accent:#39b39e;
  --accent-strong:#5fcdb8;
  --accent-soft:#132a26;
  --accent-ink:#a7ece0;

  --gold:#d9a44f;
  --gold-strong:#e8bd77;
  --gold-soft:#2a2213;

  --good:#4ea975;
  --good-soft:#132a1d;
  --good-ink:#a9e2bf;
  --warn:#d9a13f;
  --warn-soft:#2b2313;
  --warn-ink:#f0c579;
  --crit:#e0685a;
  --crit-soft:#2c1714;
  --crit-ink:#f4a99d;
  --info:#5b9ee6;
  --info-soft:#122234;

  color-scheme: dark;
}

/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:600;
  margin:0;
  text-wrap:balance;
  color:var(--ink);
  letter-spacing:-0.01em;
}
p{margin:0;}
button{font-family:inherit;font-size:inherit;color:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;}
::selection{background:var(--accent);color:#fff;}
.mono{font-family:var(--font-mono);}
.icon{display:block;flex-shrink:0;}
[hidden]{display:none!important;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid var(--bg);}

/* ============ APP SHELL ============ */
.app{
  min-height:100vh;
}

/* ---- sidebar ---- */
.sidebar{
  background:
    radial-gradient(circle at 1px 1px, rgba(199,219,213,.08) 1px, transparent 0) 0 0/22px 22px,
    linear-gradient(175deg, var(--sidebar-bg-2), var(--sidebar-bg) 60%);
  color:var(--sidebar-fg);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0; left:0; bottom:0;
  width:var(--sidebar-w);
  z-index:40;
  border-right:1px solid var(--sidebar-border);
  transition:width .18s ease;
}
.sidebar-collapse-btn{
  position:absolute; top:26px; right:-12px;
  width:24px; height:24px; border-radius:50%;
  background:var(--surface); color:var(--ink-muted);
  border:1px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:41; box-shadow:var(--shadow-sm);
  transition:color .15s, border-color .15s;
}
.sidebar-collapse-btn:hover{color:var(--ink); border-color:var(--accent);}
.app.sidebar-collapsed{--sidebar-w:68px;}
.app.sidebar-collapsed .brand{justify-content:center; padding:22px 0 18px;}
.app.sidebar-collapsed .brand-text,
.app.sidebar-collapsed .nav-label,
.app.sidebar-collapsed .nav-link span,
.app.sidebar-collapsed .sidebar-foot{display:none;}
.app.sidebar-collapsed .nav-link{justify-content:center; padding:9px;}
.app.sidebar-collapsed .nav{padding:14px 10px;}
.app.sidebar-collapsed .sidebar-collapse-btn .icon{transform:rotate(180deg);}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:22px 20px 18px;
  border-bottom:1px solid var(--sidebar-border);
  white-space:nowrap;
}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(155deg, var(--sidebar-accent), var(--sidebar-accent-strong));
  display:flex;align-items:center;justify-content:center;
  color:#eafff9;font-family:var(--font-display);font-weight:700;font-size:17px;
  box-shadow:var(--shadow-sm);
  flex-shrink:0;
}
.brand-text h1{font-size:16.5px;color:#eafaf5;letter-spacing:.01em;}
.brand-text p{font-size:10.5px;color:var(--sidebar-fg-dim);text-transform:uppercase;letter-spacing:.09em;margin-top:2px;font-weight:600;}

.nav{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--sidebar-fg-dim);padding:14px 10px 6px;font-weight:700;}
.nav-link{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:9px;
  color:var(--sidebar-fg);
  text-decoration:none;cursor:pointer;
  font-size:13.5px;font-weight:500;
  border:1px solid transparent;
  transition:background .15s ease, color .15s ease;
  position:relative;
}
.nav-link .icon{color:var(--sidebar-fg-dim);transition:color .15s ease;}
.nav-link:hover{background:rgba(255,255,255,.05);color:#eafaf5;}
.nav-link:hover .icon{color:var(--sidebar-fg);}
.nav-link.active{background:var(--sidebar-active);color:#eafaf5;border-color:rgba(94,205,184,.22);}
.nav-link.active .icon{color:var(--sidebar-accent-strong);}
.nav-link .count{
  margin-left:auto;font-family:var(--font-mono);font-size:10.5px;
  background:rgba(255,255,255,.08);padding:1px 7px;border-radius:20px;color:var(--sidebar-fg-dim);
}
.nav-link.active .count{background:rgba(94,205,184,.18);color:var(--sidebar-accent-strong);}

.sidebar-foot{
  padding:14px 20px 18px;border-top:1px solid var(--sidebar-border);
  font-size:11px;color:var(--sidebar-fg-dim);line-height:1.6;
}
.sidebar-foot strong{color:var(--sidebar-fg);display:block;font-weight:600;}

/* ---- main column ---- */
.main{
  margin-left:var(--sidebar-w);
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
  transition:margin-left .18s ease;
}
.main::before{
  content:"";
  position:fixed;
  left:var(--sidebar-w); top:0; bottom:0;
  width:3px;
  background:linear-gradient(var(--crit), transparent 0);
  background-color:var(--crit);
  opacity:.35;
  z-index:5;
  pointer-events:none;
  transition:left .18s ease;
}

.topbar{
  position:sticky; top:0; z-index:30;
  height:62px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center;
  padding:0 22px 0 26px;
  gap:16px;
}
.page-title{display:flex;flex-direction:column;min-width:0;flex:1 1 240px;overflow:hidden;max-width:360px;}
.page-title h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.page-title span{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.search-wrap{position:relative;margin-left:8px;flex:0 1 320px;}
.search-wrap input{
  width:100%;padding:8px 12px 8px 34px;border-radius:20px;
  border:1px solid var(--border-strong);background:var(--surface-2);
  outline:none;font-size:13px;
}
.search-wrap input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft);}
.search-wrap .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);overflow:hidden;z-index:50;max-height:320px;overflow-y:auto;
}
.search-results .sr-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px;}
.search-results .sr-item:last-child{border-bottom:none;}
.search-results .sr-item:hover{background:var(--surface-2);}
.search-results .sr-item b{font-size:12.5px;}
.search-results .sr-item span{font-size:11px;color:var(--ink-faint);}
.menu-item{padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--border);color:var(--ink);}
.menu-item:last-child{border-bottom:none;}
.menu-item:hover{background:var(--surface-2);}
.search-empty{padding:16px;font-size:12.5px;color:var(--ink-faint);text-align:center;}

.topbar-spacer{flex:1;}
.topbar-actions{display:flex;align-items:center;gap:8px;}

.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);
  position:relative;transition:background .15s, color .15s, border-color .15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--border-strong);}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface);}

.user-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:24px;border:1px solid var(--border);background:var(--surface);cursor:pointer;}
.user-chip .av{width:28px;height:28px;border-radius:50%;background:var(--warn-soft);color:var(--warn-ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-mono);}
.user-chip .u-name{font-size:12.5px;font-weight:600;line-height:1.2;}
.user-chip .u-role{font-size:10.5px;color:var(--ink-faint);line-height:1.2;}

.content{padding:26px 30px 60px;max-width:1520px;width:100%;margin:0 auto;}
.page{display:none;flex-direction:column;gap:22px;}
.page.active{display:flex;}

/* ============ SHARED COMPONENTS ============ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:20px 22px;}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px 0;}
.card-head h3{font-size:14.5px;font-weight:700;font-family:var(--font-body);}
.card-head .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

.grid{display:grid;gap:18px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.cols-2-1{grid-template-columns:2fr 1fr;}
.cols-1-2{grid-template-columns:1fr 2fr;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:9px;border:1px solid transparent;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:filter .12s ease, background .12s ease, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:var(--gold);color:#231604;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--ink);}
.btn-secondary:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn-danger{background:var(--crit-soft);color:var(--crit-ink);}
.btn-danger:hover{filter:brightness(0.97);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.01em;white-space:nowrap;
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-tier1{background:var(--good-soft);color:var(--good-ink);}
.badge-tier2{background:var(--warn-soft);color:var(--warn-ink);}
.badge-tier3{background:var(--crit-soft);color:var(--crit-ink);}
.badge-neutral{background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--border);}
.badge-info{background:var(--info-soft);color:var(--info);}
.badge-locked{background:var(--accent-soft);color:var(--accent-ink);}
.badge-gold{background:var(--gold-soft);color:var(--gold-strong);}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;
  background:var(--surface-2);border:1px solid var(--border);font-size:11.5px;color:var(--ink-muted);font-weight:500;
}

.divider{height:1px;background:var(--border);border:none;margin:0;}

.snapshot-row{padding:9px 4px;border-radius:6px;transition:background .12s;}
.snapshot-row[data-snapshot-jump]{cursor:pointer;}
.snapshot-row[data-snapshot-jump]:hover{background:var(--surface-2);}
.snapshot-subline{cursor:pointer;border-radius:4px;padding:1px 3px;margin:0 -3px;transition:background .12s;}
.snapshot-subline:hover{background:var(--surface-2);}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);font-weight:700;padding:16px 14px 10px;white-space:nowrap;
}
.chemo-tight th,.chemo-tight td{padding:8px 8px !important;white-space:normal !important;font-size:12px;}
@media (max-width:1000px){.nf-layout{grid-template-columns:1fr !important;}}
.nf-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 18px;}
.mdt-table th,.mdt-table td{padding:11px 14px !important;white-space:normal !important;vertical-align:top;font-size:12.5px;line-height:1.55;}
.mdt-table tbody tr:nth-child(even){background:var(--surface-2);}
tbody td{padding:13px 14px;border-top:1px solid var(--border);vertical-align:middle;}
tbody tr{cursor:pointer;transition:background .12s;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}

.progress{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
.progress > div{height:100%;background:var(--accent);border-radius:6px;}

.avatar{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-family:var(--font-mono);flex-shrink:0;border:2px solid var(--surface);
}
.avatar-sm{width:24px;height:24px;font-size:9.5px;}
.avatar-stack{display:flex;}
.avatar-stack .avatar{margin-left:-8px;}
.avatar-stack .avatar:first-child{margin-left:0;}

.kpi-tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm);
}
.kpi-tile .kpi-top{display:flex;align-items:center;justify-content:space-between;}
.kpi-tile .kpi-label{font-size:11.5px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.kpi-tile .kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.kpi-tile .kpi-value{font-family:var(--font-display);font-size:30px;font-weight:600;}
.kpi-tile .kpi-trend{font-size:11.5px;display:flex;align-items:center;gap:4px;font-weight:600;}
.trend-up{color:var(--good-ink);}
.trend-down{color:var(--crit-ink);}

.tabs-row{display:flex;align-items:stretch;border-bottom:1px solid var(--border);}
.tab-scroll-btn{
  flex-shrink:0;width:28px;border:none;background:var(--surface);color:var(--ink-faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:color .15s, background .15s;
}
.tab-scroll-btn:hover{color:var(--ink);background:var(--surface-2);}
.tabs-row.at-start .tab-scroll-btn[data-tab-scroll="left"],
.tabs-row.at-end .tab-scroll-btn[data-tab-scroll="right"]{visibility:hidden;}
.tabs{display:flex;gap:2px;padding:0 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:1;min-width:0;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  padding:11px 16px;font-size:13px;font-weight:600;color:var(--ink-faint);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;
  flex-shrink:0;white-space:nowrap;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--accent-strong);border-bottom-color:var(--accent);}

.accordion-item{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);}
.accordion-item + .accordion-item{margin-top:10px;}
.accordion-head{
  display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none;
  background:var(--surface-2);
}
.accordion-head .ai-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.accordion-head h4{font-size:13px;font-weight:700;font-family:var(--font-body);}
.accordion-head .chev{margin-left:auto;color:var(--ink-faint);transition:transform .18s;}
.accordion-item.open .chev{transform:rotate(180deg);}
.accordion-body{padding:16px 18px 18px;display:none;}
.accordion-item.open .accordion-body{display:block;}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-muted);}
.field .req{color:var(--crit);}
.field input[type=text], .field input[type=number], .field select, .field textarea{
  padding:8px 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field-row{display:flex;align-items:center;gap:8px;}
.checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);cursor:pointer;}
.checkline input{width:15px;height:15px;accent-color:var(--accent);}
.fields-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px,1fr));gap:14px;}

.stepper{display:flex;align-items:flex-start;overflow-x:auto;padding:8px 4px 4px;flex:1;min-width:0;scrollbar-width:none;-ms-overflow-style:none;}
.stepper::-webkit-scrollbar{display:none;}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:104px;cursor:pointer;position:relative;}
.step .step-line{position:absolute;top:17px;left:-50%;width:100%;height:2px;background:var(--border-strong);z-index:0;}
.step:first-child .step-line{display:none;}
.step.done .step-line{background:var(--accent);}
.step-dot{width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-mono);z-index:1;color:var(--ink-faint);}
.step.done .step-dot{background:var(--accent);border-color:var(--accent);color:#fff;}
.step.current .step-dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);box-shadow:0 0 0 4px var(--accent-soft);}
.step span.step-label{font-size:10.5px;font-weight:700;text-align:center;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;}
.step.current span.step-label{color:var(--accent-strong);}

/* External Records (Stop 0) — dashed/hollow, never solid, so it never reads as an in-house stop */
.step.step-ext .step-dot{background:var(--surface);border-style:dashed;border-color:var(--gold-strong);color:var(--gold-strong);font-size:9px;}
.step.step-ext.current .step-dot{background:var(--gold-soft);box-shadow:0 0 0 4px var(--gold-soft);}
.step.step-ext .step-line{background:var(--gold-strong);opacity:.4;}
.step.step-ext span.step-label{color:var(--gold-strong);}

/* A node saved with a Tier 2 sign-off — the OR-gate's visual signature, recurring
   across every worked-case spec: the instant one node escalates, it reads red. */
.step.step-tier2 .step-dot{background:var(--crit-soft);border-color:var(--crit);color:var(--crit-ink);}
.step.step-tier2.current .step-dot{box-shadow:0 0 0 4px var(--crit-soft);}
.step.step-tier2 .step-line{background:var(--crit);opacity:.5;}
.step.step-tier2 span.step-label{color:var(--crit-ink);}

.msg{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-md);border-left:3px solid var(--border-strong);background:var(--surface-2);}
.msg + .msg{margin-top:10px;}
.msg .msg-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.msg .msg-name{font-weight:700;font-size:13px;}
.msg .msg-role{font-size:11px;color:var(--ink-faint);}
.msg .msg-time{font-size:10.5px;color:var(--ink-faint);margin-left:auto;font-family:var(--font-mono);}
.msg .msg-text{font-size:13px;margin-top:5px;line-height:1.55;}
.msg .msg-actions{margin-top:8px;display:flex;gap:8px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(6,14,12,.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;
}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border:1px solid var(--border);}
.modal-wide{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-body{padding:20px 22px 22px;}

.phone-frame{
  width:280px;background:#0a0f0e;border-radius:38px;padding:14px;box-shadow:var(--shadow-lg);
  border:1px solid #1c2624;
}
.phone-screen{background:var(--bg);border-radius:26px;overflow:hidden;min-height:520px;display:flex;flex-direction:column;}

.toast-host{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:9px;font-size:12.5px;box-shadow:var(--shadow-lg);max-width:320px;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
.empty-state .icon{margin:0 auto 10px;}

.callout{border-radius:var(--radius-md);padding:14px 16px;font-size:12.5px;line-height:1.6;border:1px solid;}
.callout-info{background:var(--info-soft);border-color:color-mix(in srgb, var(--info) 30%, transparent);color:var(--ink);}
.callout-good{background:var(--good-soft);border-color:color-mix(in srgb, var(--good) 30%, transparent);color:var(--ink);}
.callout-gold{background:var(--gold-soft);border-color:color-mix(in srgb, var(--gold) 35%, transparent);color:var(--ink);}

.switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .track{position:absolute;inset:0;background:var(--border-strong);border-radius:20px;cursor:pointer;transition:background .15s;}
.switch .track::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:var(--shadow-sm);}
.switch input:checked + .track{background:var(--accent);}
.switch input:checked + .track::before{transform:translateX(16px);}

.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.filter-bar select, .filter-bar .search-wrap input{
  padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;
}

.mini-donut-legend{display:flex;flex-direction:column;gap:10px;}
.legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.legend-row .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.legend-row .lv{margin-left:auto;font-weight:700;font-family:var(--font-mono);}

.timeline-side{display:flex;flex-direction:column;gap:3px;}
.tl-dot-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:8px;cursor:pointer;}
.tl-dot-row:hover{background:var(--surface-2);}
.tl-dot-row .tdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

@media (max-width: 980px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-2, .cols-2-1, .cols-1-2{grid-template-columns:1fr;}
}
@media (max-width: 640px){
  .grid-4, .grid-3{grid-template-columns:1fr 1fr;}
  .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg);width:252px !important;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-collapse-btn{display:none;}
  .app.sidebar-collapsed .brand-text, .app.sidebar-collapsed .nav-label, .app.sidebar-collapsed .nav-link span, .app.sidebar-collapsed .sidebar-foot{display:initial;}
  .app.sidebar-collapsed .nav-link{justify-content:flex-start;}
  .main{margin-left:0 !important;}
  .main::before{display:none;}
  .search-wrap{display:none;}
  #menuToggle{display:flex !important;}
}
/* Getting-started walkthrough */
.onb-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start;}
.onb-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;}
.onb-cap{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:6px;}
@media (max-width:1150px){.onb-body{grid-template-columns:minmax(0,1fr);}}
@media (max-width:820px){.onb-layout{grid-template-columns:minmax(0,1fr);}.onb-rail{position:static !important;flex-direction:row !important;overflow-x:auto;}}
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar"></button>
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-text">
        <h1>MILESTONE</h1>
        <p>Clinical Decision Platform</p>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">
      <strong>Regional Cancer Center</strong>
      Thiruvananthapuram · Pilot build
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuToggle" style="display:none;" aria-label="Menu"></button>
      <div class="page-title">
        <h2 id="pageTitle">Dashboard</h2>
        <span id="pageSubtitle">Welcome back</span>
      </div>
      <div class="search-wrap">
        <span class="icon"></span>
        <input type="text" id="globalSearch" placeholder="Search cases, patients, diagnoses…" autocomplete="off">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"></button>
        <button class="icon-btn" id="mobilePreviewBtn" aria-label="Mobile preview" title="Mobile app preview"></button>
        <div style="position:relative;">
          <button class="icon-btn" id="notifBtn" aria-label="Notifications" title="Notifications"><span class="dot" id="notifDot" hidden></span></button>
          <div class="search-results" id="notifPanel" style="width:340px;right:0;left:auto;" hidden></div>
        </div>
        <div class="user-chip" id="userChip" title="Current user">
          <div class="av">AR</div>
          <div>
            <div class="u-name">Dr. A. Rao</div>
            <div class="u-role">Medical Oncology</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content" id="content"></div>
  </div>
</div>

<div id="modalHost"></div>
<div class="toast-host" id="toastHost"></div>

<script src="app.js"></script>
</body>
</html>
